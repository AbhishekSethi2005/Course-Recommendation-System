# CourseIQ - Local Development Docker Compose Configuration
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseiq-backend-dev
    command: ["python", "app.py"]
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5000
      - DATA_DIR=/app/data
    volumes:
      - .:/app
      - /app/frontend/node_modules
    networks:
      - courseiq-dev-network

  frontend-dev:
    image: node:20-alpine
    container_name: courseiq-frontend-dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    networks:
      - courseiq-dev-network

networks:
  courseiq-dev-network:
    name: courseiq-dev-network
    driver: bridge

